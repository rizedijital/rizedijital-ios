<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>RizeDijital</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#fff}
    body{display:grid;place-items:center;overflow:hidden}
    .rd-launch-mascot{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:24px}
    .rd-launch-mascot img{display:block;width:min(46vw,220px);height:auto;max-height:52vh;object-fit:contain;object-position:center;border:0;border-radius:0;box-shadow:none;transform-origin:50% 55%;animation:rdMascotFloat 1.1s ease-in-out infinite}
    @keyframes rdMascotFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.025)}}
    @media (prefers-reduced-motion:reduce){.rd-launch-mascot img{animation:none}}
  </style>
</head>
<body>
  <main class="rd-launch-mascot" aria-label="RizeDijital hazırlanıyor">
    <img src="assets/rizedijital-transition-mascot.png" alt="RizeDijital maskotu">
  </main>
</body>
</html>
