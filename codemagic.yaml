# RizeDijital v1.00.19
# Repository root contains ios-apple/
# iOS Simulator + signed App Store IPA workflows.
# Signed workflow exports an IPA and uploads it to App Store Connect / TestFlight.

workflows:
  rizedijital-ios-simulator:
    name: RizeDijital iOS Simulator (no Apple signing)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-apple"
          npm ci
          npm run verify:versions
          npm run verify:ios
          npm run verify:release

      - name: Synchronize Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-apple"
          npx cap sync ios
          node scripts/configure-ios-google-client.mjs

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-apple/ios/App"
          pod install
          echo "CocoaPods lockfile generated from the resolved dependencies:"
          test -s Podfile.lock
          shasum -a 256 Podfile.lock

      - name: Build iOS Simulator
        script: |
          set -e
          xcodebuild -workspace "$CM_BUILD_DIR/ios-apple/ios/App/App.xcworkspace" \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios-apple/ios/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test iOS Simulator startup
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/ios-apple/scripts/test-ios-simulator.sh"

    artifacts:
      - ios-apple/ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
      - ios-preview.png
      - ios-apple/ios/App/Podfile.lock

  rizedijital-ios-signed:
    name: RizeDijital iOS Signed IPA (App Store/TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "Codemagic RizeDijital"

    environment:
      groups:
        - rizedijital
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rizedijital.app

    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-apple"
          npm ci
          npm run verify:versions
          npm run verify:ios
          npm run verify:release

      - name: Synchronize Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-apple"
          npx cap sync ios
          node scripts/configure-ios-google-client.mjs

      - name: Verify Apple build history and assign unique number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios-apple"
          # The numeric Apple ID is NOT the bundle ID (com.rizedijital.app).
          # Never publish with an unverified fallback number.
          : "${APP_STORE_APPLE_ID:?Set numeric APP_STORE_APPLE_ID in Codemagic environment variables before publishing}"
          case "$APP_STORE_APPLE_ID" in *[!0-9]*|'') echo "ERROR: APP_STORE_APPLE_ID must be numeric."; exit 1;; esac
          echo "Checking highest Apple build across ALL app versions..."
          LATEST="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions)" || {
            echo "ERROR: App Store Connect lookup failed; stopping to prevent a duplicate upload."; exit 1;
          }
          case "$LATEST" in *[!0-9]*|'') echo "ERROR: Unexpected Apple build number: $LATEST"; exit 1;; esac
          SOURCE_BUILD="$(node -p 'require("../release.json").iosBuild')"
          CI_NUMBER="${CM_BUILD_NUMBER:-0}"
          case "$CI_NUMBER" in *[!0-9]*|'') echo "ERROR: Invalid CM_BUILD_NUMBER"; exit 1;; esac
          # Margin provides protection from delayed Apple processing and concurrent builds.
          NEW_BUILD="$((LATEST + 1))"
          if [ "$NEW_BUILD" -le "$SOURCE_BUILD" ]; then NEW_BUILD="$((SOURCE_BUILD + 1))"; fi
          if [ "$NEW_BUILD" -le "$CI_NUMBER" ]; then NEW_BUILD="$((CI_NUMBER + 1))"; fi
          echo "Apple highest: $LATEST | Source: $SOURCE_BUILD | Codemagic counter: $CI_NUMBER | New: $NEW_BUILD"
          node scripts/set-ios-build-number.mjs "$NEW_BUILD"
          npm run verify:versions
          npm run verify:ios
          npm run verify:release

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-apple/ios/App"
          pod install
          echo "CocoaPods lockfile generated from the resolved dependencies:"
          test -s Podfile.lock
          shasum -a 256 Podfile.lock

      - name: Apply Apple provisioning profiles
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios-apple/ios/App/App.xcodeproj"

      - name: Build signed IPA and validate its actual contents
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios-apple/ios/App"
          echo "=== CREATE APP STORE IPA ==="
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios-apple/ios/App/App.xcworkspace" \
            --scheme App

          echo "=== FIND EXPORTED IPA ==="
          # Reject ambiguous exports rather than publishing a stale/wrong IPA.
          find "$CM_BUILD_DIR" -type f -name '*.ipa' ! -path '*/ipa_artifacts/*' > /tmp/rizedijital-ipa-paths.txt
          IPA_COUNT="$(wc -l < /tmp/rizedijital-ipa-paths.txt | tr -d ' ')"
          if [ "$IPA_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one newly exported IPA, found $IPA_COUNT:"
            cat /tmp/rizedijital-ipa-paths.txt
            exit 1
          fi
          IPA="$(cat /tmp/rizedijital-ipa-paths.txt)"
          EXPECTED_BUILD="$(node -p 'require("../release.json").iosBuild')"
          EXPECTED_VERSION="$(node -p 'require("../release.json").iosVersion')"
          echo "=== VERIFY ACTUAL IPA METADATA ==="
          python3 "$CM_BUILD_DIR/ios-apple/scripts/verify-exported-ipa.py" \
            "$IPA" "$EXPECTED_VERSION" "$EXPECTED_BUILD" "com.rizedijital.app"
          mkdir -p "$CM_BUILD_DIR/ipa_artifacts"
          DEST="$CM_BUILD_DIR/ipa_artifacts/RizeDijital.ipa"
          cp "$IPA" "$DEST"
          test -s "$DEST"
          ls -lh "$DEST"
          echo "Validated IPA: version=$EXPECTED_VERSION build=$EXPECTED_BUILD"

    artifacts:
      - ipa_artifacts/*.ipa
      - ios-apple/ios/App/Podfile.lock
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
