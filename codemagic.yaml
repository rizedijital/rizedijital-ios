# RizeDijital v1.00.18 — deploy with project root containing mobile-app/.
# Replace REPLACE_WITH_YOUR_CODEMAGIC_API_KEY_NAME after creating a Codemagic Developer Portal integration.
# Signing credentials, API keys and certificates are never stored in this repository.
workflows:
  rizedijital-ios-simulator:
    name: RizeDijital iOS Simulator (no Apple signing)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          npm ci
          npm run verify:versions
          npm run verify:ios
      - name: Synchronize Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          node scripts/configure-ios-google-client.mjs
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app/ios/App"
          pod install
      - name: Build iOS Simulator
        script: |
          set -e
          xcodebuild -workspace "$CM_BUILD_DIR/mobile-app/ios/App/App.xcworkspace" \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/mobile-app/ios/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test iOS Simulator startup
        script: |
          set -euo pipefail

          echo "=== FIND BUILT APP ==="
          APP="$CM_BUILD_DIR/mobile-app/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$CM_BUILD_DIR/mobile-app/ios" -type d -name 'App.app' -print -quit)"
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            APP="$(find "$CM_BUILD_DIR" -type d -name 'App.app' -print -quit)"
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            ZIP="$(find "$CM_BUILD_DIR" -type f -name 'App.app.zip' -print -quit)"
            if [ -n "$ZIP" ]; then
              mkdir -p "$CM_BUILD_DIR/simulator-test-app"
              ditto -x -k "$ZIP" "$CM_BUILD_DIR/simulator-test-app"
              APP="$(find "$CM_BUILD_DIR/simulator-test-app" -type d -name 'App.app' -print -quit)"
            fi
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: Built App.app not found. Candidates:"
            find "$CM_BUILD_DIR/mobile-app/ios" -name 'App.app*' -print || true
            exit 1
          fi

          echo "Found app: $APP"
          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: App.app/Info.plist is missing"
            exit 1
          fi
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          echo "Bundle ID: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != 'com.rizedijital.app' ]; then
            echo "ERROR: Unexpected application bundle ID"
            exit 1
          fi

          echo "=== BOOT SIMULATOR ==="
          SDKV="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SDKV//./-}"
          echo "Simulator runtime: $RUNTIME"
          UDID="$(xcrun simctl create rd-ios-test com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          echo "=== INSTALL TEST ==="
          xcrun simctl install "$UDID" "$APP"
          echo "=== LAUNCH TEST ==="
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 8

          echo "=== SCREENSHOT ==="
          xcrun simctl io "$UDID" screenshot "$CM_BUILD_DIR/ios-preview.png"
          echo "Screenshot saved: $CM_BUILD_DIR/ios-preview.png"
    artifacts:
      - mobile-app/ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
      - ios-preview.png
  rizedijital-ios-signed:
    name: RizeDijital iOS Signed IPA (App Store/TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: REPLACE_WITH_YOUR_CODEMAGIC_API_KEY_NAME
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rizedijital.app
    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          npm ci
          npm run verify:versions
          npm run verify:ios
      - name: Synchronize Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          node scripts/configure-ios-google-client.mjs
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app/ios/App"
          pod install
      - name: Apply Apple provisioning profiles
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app/ios/App"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile-app/ios/App/App.xcworkspace" \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile-app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
    # Upload to TestFlight is deliberately off until signing and sandbox IAP tests succeed.
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
    #     submit_to_app_store: false
