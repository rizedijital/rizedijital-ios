# RizeDijital v1.00.18
# Project root must contain mobile-app/
# iOS Simulator and App Store/TestFlight archive diagnostics
# Signed workflow is in DIAGNOSTIC mode: archive + full Xcode error log, no IPA export.

workflows:
  rizedijital-ios-simulator:
    name: RizeDijital iOS Simulator (no Apple signing)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          npm ci
          npm run verify:versions
          npm run verify:ios

      - name: Synchronize Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          npx cap sync ios
          node scripts/configure-ios-google-client.mjs

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app/ios/App"
          pod install

      - name: Build iOS Simulator
        script: |
          set -e
          xcodebuild -workspace "$CM_BUILD_DIR/mobile-app/ios/App/App.xcworkspace" \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/mobile-app/ios/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test iOS Simulator startup
        script: |
          set -euo pipefail

          echo "=== FIND BUILT APP ==="
          APP="$CM_BUILD_DIR/mobile-app/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app"

          if [ ! -d "$APP" ]; then
            APP="$(find "$CM_BUILD_DIR/mobile-app/ios" -type d -name 'App.app' -print -quit)"
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            APP="$(find "$CM_BUILD_DIR" -type d -name 'App.app' -print -quit)"
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            ZIP="$(find "$CM_BUILD_DIR" -type f -name 'App.app.zip' -print -quit)"
            if [ -n "$ZIP" ]; then
              mkdir -p "$CM_BUILD_DIR/simulator-test-app"
              ditto -x -k "$ZIP" "$CM_BUILD_DIR/simulator-test-app"
              APP="$(find "$CM_BUILD_DIR/simulator-test-app" -type d -name 'App.app' -print -quit)"
            fi
          fi

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: Built App.app not found."
            find "$CM_BUILD_DIR/mobile-app/ios" -name 'App.app*' -print || true
            exit 1
          fi

          echo "Found app: $APP"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: App.app/Info.plist is missing"
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != 'com.rizedijital.app' ]; then
            echo "ERROR: Unexpected application bundle ID"
            exit 1
          fi

          echo "=== BOOT SIMULATOR ==="
          SDKV="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SDKV//./-}"

          SIMULATOR_ID=$(xcrun simctl create rd-ios-test com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

          echo "=== INSTALL TEST ==="
          xcrun simctl install "$SIMULATOR_ID" "$APP"

          echo "=== LAUNCH TEST ==="
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 8

          echo "=== SCREENSHOT ==="
          xcrun simctl io "$SIMULATOR_ID" screenshot "$CM_BUILD_DIR/ios-preview.png"

          echo "Screenshot saved: $CM_BUILD_DIR/ios-preview.png"

    artifacts:
      - mobile-app/ios/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
      - ios-preview.png

  rizedijital-ios-signed:
    name: RizeDijital iOS Signed IPA (App Store/TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "Codemagic RizeDijital"

    environment:
      node: 22
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rizedijital.app

    scripts:
      - name: Install npm dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          npm ci
          npm run verify:versions
          npm run verify:ios

      - name: Synchronize Capacitor iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app"
          npx cap sync ios
          node scripts/configure-ios-google-client.mjs

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app/ios/App"
          pod install

      - name: Apply Apple provisioning profiles
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile-app/ios/App"
          xcode-project use-profiles

      # TEMPORARY DIAGNOSTIC STEP:
      # Direct xcodebuild captures the full archive error instead of only
      # printing "Failed to archive". Replace with build-ipa after diagnosis.
      - name: Diagnose iOS Release Archive
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/mobile-app"
          LOG="$CM_BUILD_DIR/rizedijital-xcode-full.log"

          set +e
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/RizeDijital.xcarchive" \
            archive > "$LOG" 2>&1
          RESULT=$?

          echo '========== GERCEK XCODE HATALARI =========='
          grep -nEi 'error:|error |failed|provisioning|codesign|certificate|ARCHIVE FAILED' "$LOG" | tail -100 || true
          echo '========== SON 100 SATIR =========='
          tail -100 "$LOG"
          echo "Archive exit status: $RESULT"
          if [ "$RESULT" -eq 0 ]; then
            echo "ARCHIVE SUCCEEDED. IPA export is intentionally disabled during diagnostics."
          fi
          exit "$RESULT"

    artifacts:
      - rizedijital-xcode-full.log
      - /tmp/xcodebuild_logs/*.log
      - build/ios/ipa/*.ipa
      - mobile-app/ios/App/build/ios/ipa/*.ipa
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"

    # TestFlight upload disabled until signing issue is resolved.
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
    #     submit_to_app_store: false
